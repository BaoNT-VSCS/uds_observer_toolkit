# Basic, bounded fuzzing/probing templates.
# These are disabled by default unless safety.authorized=true or CLI flag is provided.

safety:
  authorized: false

testcases:
  - name: fuzz_arbids_tester_present
    type: arb_id_fuzzer
    target: ecu1
    txid_range: 0x700-0x70F
    probe_payload: "3E 00"
    per_id_timeout: 0.08
    delay: 0.01
    max_items: 32
    collect_limit_per_id: 5

  - name: fuzz_services_known_target
    type: service_fuzzer
    target: ecu1
    session_flow: [0x03]
    services: "0x10-0x3E"
    max_items: 64
    delay: 0.05

  - name: fuzz_diag_sessions
    type: subservice_fuzzer
    target: ecu1
    service: 0x10
    subfunctions: "0x01-0x7F"
    max_items: 128
    delay: 0.05

  - name: fuzz_security_access_subfunctions
    type: subservice_fuzzer
    target: ecu1
    session_flow: [0x03]
    service: 0x27
    subfunctions: "0x01-0x20"
    max_items: 64
    delay: 0.08

  - name: payload_regression_small
    type: payload_fuzzer
    target: ecu1
    session_flow: [0x03]
    payloads:
      - "3E 00"
      - "27 01"
      - "10 01"
      - "10 02"
      - "10 03"
    delay: 0.10
