# Section 10 UDS access-control training/security probes.
# Authorized bench/simulator/owned ECU testing only.
# Destructive services are intentionally not confirmed in these templates.

safety:
  authorized: false

testcases:
  - name: uds20_ecu_reset_precondition
    test_id: "UDS-20"
    title: "Missing Pre-conditions For ECU Reset"
    group: "Section 10 - Access Control"
    category: "Access Control"
    mode: "ecu-reset-precondition"
    objective: "Check whether ECU Reset is accepted without required preconditions or authorization."
    expected_behavior: "ECU should reject reset with an acceptable NRC."
    threat_condition: "ECU accepts reset without required preconditions."
    safety_level: "disruptive"
    destructive_confirm_required: true
    type: uds_access_control_probe
    target: ecu1
    service: "0x11"
    subfunction: "0x01"
    session_flow: [0x01]
    security_access_required: false
    destructive_confirm: false
    requests:
      - step: ecu-reset-hardreset-without-preconditions
        service: 0x11
        payload: "11 01"
        expected_positive_sid: 0x51
        acceptable_nrcs: [0x22, 0x24, 0x31, 0x33, 0x7E, 0x7F]
        threat_if_positive: true
        check_subfn: true
        notes: "Threat if ECU accepts reset without required preconditions."

