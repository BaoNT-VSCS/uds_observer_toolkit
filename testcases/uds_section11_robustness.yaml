  - name: uds29_communication_control_when_operational
    type: diagnostic_service
    case_id: uds_29
    test_id: UDS-29
    display_id: UDS-29
    canonical_id: uds29_communication_control_when_operational
    title: UDS-29 CommunicationControl 0x28 While Operational
    category: UDS Test Cases
    risk_property: availability / communication availability / operational safety
    service_id: "0x28"
    default_payload: "28 01 01"
    implemented: true
    parameters:
      session_flow: ""
      communication_control_preset: "0x01"
      communication_type: "0x01"
      manual_communication_type: "0x01"
      vehicle_state: parked
      raw_payload_override: ""
      advanced_raw_payload_override_enabled: false
      authorization_state_note: ""
      communication_disruption_observed: unknown
      diagnostic_observation_note: ""
      physical_observation_note: ""
      recovery_note: ""
      analyst_note: ""
    ui_parameters:
      - key: session_flow
        label: Diagnostic session flow
        kind: textarea
        default: ""
        help: "Optional. Leave empty to send without diagnostic-session setup."
      - key: communication_control_preset
        label: Message preset / controlType
        kind: combo
        default: "0x01"
        choices:
          - {label: "28 00 <communicationType> — enableRxAndTx", value: "0x00"}
          - {label: "28 01 <communicationType> — enableRxAndDisableTx", value: "0x01"}
          - {label: "28 02 <communicationType> — disableRxAndEnableTx", value: "0x02"}
          - {label: "28 03 <communicationType> — disableRxAndTx", value: "0x03"}
          - {label: manual, value: manual}
      - key: communication_type
        label: Communication type
        kind: combo
        default: "0x01"
        choices:
          - {label: normal communication, value: "0x01"}
          - {label: network management communication, value: "0x02"}
          - {label: both normal and network management, value: "0x03"}
          - {label: OEM/custom value, value: manual}
      - key: manual_communication_type
        label: Manual communication type
        kind: text
        default: "0x01"
      - key: vehicle_state
        label: Vehicle state
        kind: combo
        default: parked
        choices:
          - {label: parked, value: parked}
          - {label: ignition on, value: ignition on}
          - {label: operational/driving-state simulated, value: operational/driving-state simulated}
          - {label: controlled driving test, value: controlled driving test}
      - key: physical_observation_note
        label: Physical observation note
        kind: textarea
        default: ""
        help: Manual observation recorded with evidence.
    preconditions:
      - Execute one controlled CommunicationControl request only; no flood or repeated aggressive send.
      - Operational/driving-state testing must not be run on public roads.
    safety_level: destructive-diagnostic
    safety_guard:
      max_duration_seconds: 10.0
      max_frame_rate: 2.0
      max_messages: 1
      max_send_rate: 2.0
      stop_button_required: true
      stop_on_bus_error: true
      tester_present_enabled: false
      tester_present_interval_seconds: 2.0
    expected_behavior: Assessment scenario checks whether CommunicationControl 0x28 is rejected in unsafe or unauthorized operational conditions.
    pass_criteria:
      - ECU rejects unsafe or unauthorized CommunicationControl in the tested operational state.
    fail_criteria:
      - ECU accepts CommunicationControl in an operational/driving-state where it should be restricted, especially with disruption or physical impact.
    evidence_fields:
      - timestamp
      - display_id
      - canonical_id
      - target_profile
      - session_flow
      - vehicle_state
      - controlType
      - controlType_meaning
      - communicationType
      - communicationType_meaning
      - request_payload
      - response_payload
      - response_classification
      - communication_disruption_observed
      - diagnostic_observation_note
      - physical_observation_note
      - recovery_note
      - verdict
      - raw_log_path

