testcases:
  - name: uds26_diagnostic_service_placeholder
    type: diagnostic_service
    case_id: uds_26
    test_id: UDS-26
    title: UDS-26 Diagnostic Service Placeholder
    category: UDS-26..32 Framework
    risk_property: Future diagnostic-service validation for UDS-26.
    service_id: ""
    default_payload: "<service> <payload>"
    parameters:
      session_flow: "03"
      service_id: ""
      request_payload: ""
      physical_observation_note: ""
    ui_parameters: &future_ui_parameters
      - key: session_flow
        label: Diagnostic session flow
        kind: textarea
        default: "03"
        help: "Subfunctions only: 03 or 03 02."
      - key: service_id
        label: Service ID
        kind: text
        default: ""
        help: Future UDS service ID.
      - key: request_payload
        label: Request payload
        kind: textarea
        default: ""
        help: Future payload bytes.
      - key: physical_observation_note
        label: Physical observation note
        kind: textarea
        default: ""
        help: Manual observation recorded with evidence.
      - key: max_duration_seconds
        label: Max duration seconds
        kind: text
        default: "30.0"
        required: true
      - key: max_frame_rate
        label: Max frame rate
        kind: text
        default: "10.0"
        required: true
      - key: tester_present_enabled
        label: TesterPresent enabled
        kind: checkbox
        default: false
      - key: tester_present_interval_seconds
        label: TesterPresent interval seconds
        kind: text
        default: "2.0"
        required: true
    preconditions: &future_preconditions
      - Bench/simulator mode is required.
      - Manual confirmation is required before execution once logic is implemented.
      - Execution is currently stubbed and performs no CAN transmission.
    safety_level: framework-placeholder
    safety_guard: &future_safety_guard
      bench_mode_required: true
      manual_confirm_required: true
      max_duration_seconds: 30.0
      max_frame_rate: 10.0
      stop_button_required: true
      stop_on_bus_error: true
      tester_present_enabled: false
      tester_present_interval_seconds: 2.0
    expected_behavior: Case definition is visible and reviewable; execution logic will be added in a later task.
    pass_criteria: &future_pass_criteria
      - Framework can load the case definition and show parameters without sending CAN frames.
    fail_criteria: &future_fail_criteria
      - Framework cannot load the case definition or attempts CAN transmission before implementation.
    evidence_fields: &future_evidence_fields
      - timestamp
      - target_profile
      - session_flow
      - request_payload
      - response_payload
      - physical_observation_note
      - verdict
      - raw_log_path

