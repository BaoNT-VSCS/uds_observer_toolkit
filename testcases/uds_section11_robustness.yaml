testcases:
  - name: uds26_unauthenticated_control_dtc_setting
    type: diagnostic_service
    case_id: uds_26
    test_id: UDS-26
    display_id: UDS-26
    canonical_id: uds26_unauthenticated_control_dtc_setting
    title: UDS-26 Unauthenticated Control DTC Setting
    description: Check whether UDS service 0x85 ControlDTCSetting is accepted without proper authorization/security access.
    category: UDS Test Cases
    case_family: diagnostic_service
    risk_property: diagnostic integrity / system integrity
    service_id: "0x85"
    default_payload: "85 01"
    implemented: true
    supported_subfunctions:
      "0x01": "on / enable DTC setting"
      "0x02": "off / disable DTC setting"
    parameters:
      session_flow: ""
      subfunction: "0x01"
      raw_payload_override: ""
      advanced_raw_payload_override_enabled: false
      authorization_state_note: "No SecurityAccess seed/key exchange performed by this test."
      diagnostic_observation_note: ""
      dtc_update_effect_confirmed: "unknown"
      analyst_note: ""
      physical_observation_note: ""
    ui_parameters:
      - key: session_flow
        label: Diagnostic session flow
        kind: textarea
        default: ""
        help: "Optional. Leave empty to send without diagnostic-session setup."
      - key: subfunction
        label: ControlDTCSetting subfunction
        kind: combo
        default: "0x01"
        required: true
        choices:
          - label: "85 01 - enable DTC setting"
            value: "0x01"
          - label: "85 02 - disable DTC setting (warning: may suppress DTC updates)"
            value: "0x02"
          - label: "85 81 - enable DTC setting, suppress positive response"
            value: "0x81"
          - label: "85 82 - disable DTC setting, suppress positive response (warning)"
            value: "0x82"
      - key: raw_payload_override
        label: Raw payload override
        kind: textarea
        default: ""
        help: "Optional full payload. For UDS-26 it must start with 85 unless advanced override is explicitly enabled."
      - key: advanced_raw_payload_override_enabled
        label: Advanced raw override
        kind: checkbox
        default: false
        help: "Allows non-0x85 raw payloads. Use only for manual lab analysis; normal UDS-26 validation rejects them."
      - key: authorization_state_note
        label: Authorization/security state note
        kind: textarea
        default: "No SecurityAccess seed/key exchange performed by this test."
        help: Describe active session/security state before interpreting positive responses.
      - key: diagnostic_observation_note
        label: Diagnostic observation note
        kind: textarea
        default: ""
        help: Note DTC/logging behavior observed outside the UDS response.
      - key: dtc_update_effect_confirmed
        label: DTC update effect confirmed
        kind: combo
        default: "unknown"
        choices:
          - label: "unknown"
            value: "unknown"
          - label: "true"
            value: "true"
          - label: "false"
            value: "false"
      - key: analyst_note
        label: Analyst note
        kind: textarea
        default: ""
        help: Manual reviewer note for report context.
      - key: physical_observation_note
        label: Physical observation note
        kind: textarea
        default: ""
        help: Optional physical or bench observation.
      - key: max_duration_seconds
        label: Max duration seconds
        kind: text
        default: "10.0"
        required: true
      - key: max_frame_rate
        label: Max frame rate
        kind: text
        default: "2.0"
        required: true
      - key: tester_present_enabled
        label: TesterPresent enabled
        kind: checkbox
        default: false
      - key: tester_present_interval_seconds
        label: TesterPresent interval seconds
        kind: text
        default: "2.0"
        required: true
    preconditions:
      - Operator must understand that changing DTC setting may affect diagnostic logging/evidence.
      - This test does not perform SecurityAccess seed/key exchange before ControlDTCSetting.
      - Single-shot execution only; no flood behavior.
    safety_level: controlled-diagnostic
    safety_warning: Changing DTC setting may affect diagnostic evidence and logging behavior.
    safety_guard:
      max_duration_seconds: 10.0
      max_frame_rate: 2.0
      stop_button_required: true
      stop_on_bus_error: true
      tester_present_enabled: false
      tester_present_interval_seconds: 2.0
    expected_behavior: ECU should not allow unauthorized ControlDTCSetting changes in a restricted state.
    pass_criteria:
      - ECU rejects ControlDTCSetting in the tested unauthorized state with a valid negative response or otherwise does not allow unauthorized DTC setting control.
    fail_criteria:
      - ECU accepts 0x85 without SecurityAccess/authorization in a state where ControlDTCSetting should be restricted.
    evidence_fields:
      - timestamp
      - display_id
      - canonical_id
      - target_profile
      - session_flow
      - selected_subfunction
      - selected_subfunction_meaning
      - suppress_positive_response_requested
      - raw_payload_override
      - request_payload
      - response_payload
      - response_classification
      - positive_response
      - nrc
      - timeout_or_no_response
      - authorization_state_note
      - diagnostic_observation_note
      - dtc_update_effect_confirmed
      - physical_observation_note
      - analyst_note
      - verdict
      - raw_log_path

  - name: uds27_unauthenticated_clear_diagnostic_information
    type: diagnostic_service
    case_id: uds_27
    test_id: UDS-27
    display_id: UDS-27
    canonical_id: uds27_unauthenticated_clear_diagnostic_information
    title: UDS-27 Unauthenticated Clear Diagnostic Information
    description: Check whether UDS service 0x14 ClearDiagnosticInformation is accepted without proper authorization/security access.
    category: UDS Test Cases
    case_family: diagnostic_service
    risk_property: diagnostic integrity / evidence integrity
    service_id: "0x14"
    default_payload: "14 FF FF FF"
    implemented: true
    destructive_or_disruptive: true
    supported_group_of_dtc_presets:
      "FF FF FF": "all DTC groups"
      custom: "manual 3-byte groupOfDTC"
      raw_payload_override: "advanced raw payload override"
    parameters:
      session_flow: ""
      group_of_dtc_preset: "all"
      group_of_dtc: "FF FF FF"
      raw_payload_override: ""
      advanced_raw_payload_override_enabled: false
      authorization_state_note: "No SecurityAccess seed/key exchange performed by this test."
      dtc_state_before_note: ""
      dtc_state_after_note: ""
      dtc_clear_effect_confirmed: "unknown"
      diagnostic_observation_note: ""
      physical_observation_note: ""
      analyst_note: ""
    ui_parameters:
      - key: session_flow
        label: Diagnostic session flow
        kind: textarea
        default: ""
        help: "Optional. Leave empty to send without diagnostic-session setup."
      - key: group_of_dtc_preset
        label: groupOfDTC preset
        kind: combo
        default: "all"
        required: true
        choices:
          - label: "14 FF FF FF - clear all DTC groups"
            value: "all"
          - label: "custom 3-byte groupOfDTC"
            value: "custom"
      - key: group_of_dtc
        label: Manual groupOfDTC
        kind: textarea
        default: "FF FF FF"
        help: "Exactly 3 bytes. Used when groupOfDTC preset is custom."
      - key: raw_payload_override
        label: Raw payload override
        kind: textarea
        default: ""
        help: "Advanced only. Normal UDS-27 request is 14 plus exactly 3 groupOfDTC bytes."
      - key: advanced_raw_payload_override_enabled
        label: Advanced raw override
        kind: checkbox
        default: false
        help: "Required for raw payload override. Allows manual lab payloads such as 14 FF FF FF FF."
      - key: authorization_state_note
        label: Authorization/security state note
        kind: textarea
        default: "No SecurityAccess seed/key exchange performed by this test."
        help: Describe active session/security state before interpreting positive responses.
      - key: dtc_state_before_note
        label: DTC state before note
        kind: textarea
        default: ""
        help: Manual DTC/evidence state before ClearDiagnosticInformation.
      - key: dtc_state_after_note
        label: DTC state after note
        kind: textarea
        default: ""
        help: Manual DTC/evidence state after ClearDiagnosticInformation.
      - key: dtc_clear_effect_confirmed
        label: DTC clear effect confirmed
        kind: combo
        default: "unknown"
        choices:
          - label: "unknown"
            value: "unknown"
          - label: "true"
            value: "true"
          - label: "false"
            value: "false"
      - key: diagnostic_observation_note
        label: Diagnostic observation note
        kind: textarea
        default: ""
        help: Note DTC/logging behavior observed outside the UDS response.
      - key: physical_observation_note
        label: Physical observation note
        kind: textarea
        default: ""
        help: Optional physical or bench observation.
      - key: analyst_note
        label: Analyst note
        kind: textarea
        default: ""
        help: Manual reviewer note for report context.
      - key: max_duration_seconds
        label: Max duration seconds
        kind: text
        default: "10.0"
        required: true
      - key: max_frame_rate
        label: Max frame rate
        kind: text
        default: "2.0"
        required: true
      - key: tester_present_enabled
        label: TesterPresent enabled
        kind: checkbox
        default: false
      - key: tester_present_interval_seconds
        label: TesterPresent interval seconds
        kind: text
        default: "2.0"
        required: true
    preconditions:
      - Operator must understand that ClearDiagnosticInformation may erase DTC records and diagnostic evidence.
      - This test does not perform SecurityAccess seed/key exchange before ClearDiagnosticInformation.
      - Single-shot execution only; no flood behavior.
    safety_level: destructive-diagnostic
    safety_warning: This test may erase diagnostic evidence / DTC records. ECU response is recorded as observed.
    safety_guard:
      max_duration_seconds: 10.0
      max_frame_rate: 2.0
      stop_button_required: true
      stop_on_bus_error: true
      tester_present_enabled: false
      tester_present_interval_seconds: 2.0
    expected_behavior: ECU should not allow unauthorized ClearDiagnosticInformation in a restricted state.
    pass_criteria:
      - ECU rejects ClearDiagnosticInformation in the tested unauthorized state with a valid negative response or otherwise does not allow DTC clearing.
    fail_criteria:
      - ECU accepts 0x14 without SecurityAccess/authorization in a state where ClearDiagnosticInformation should be restricted.
    evidence_fields:
      - timestamp
      - display_id
      - canonical_id
      - target_profile
      - session_flow
      - selected_group_of_dtc
      - group_of_dtc_meaning
      - raw_payload_override
      - request_payload
      - response_payload
      - response_classification
      - positive_response
      - nrc
      - timeout_or_no_response
      - authorization_state_note
      - dtc_state_before_note
      - dtc_state_after_note
      - dtc_clear_effect_confirmed
      - diagnostic_observation_note
      - physical_observation_note
      - analyst_note
      - verdict
      - raw_log_path

