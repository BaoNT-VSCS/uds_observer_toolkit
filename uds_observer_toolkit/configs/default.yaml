# Default connection and timing profile.
# Plain hex strings are parsed as hexadecimal, so 681 means 0x681.

safety:
  # Fuzzing cases refuse to run unless this is true or CLI uses --yes-i-am-authorized.
  authorized: false

can:
  channel: can0
  interface: socketcan
  extended_id: false
  padding: 0x00
  receive_own_messages: false

# Global ISO-TP/UDS timing.
timing:
  timeout: 1.0
  response_pending_timeout: 5.0
  post_session_delay: 0.05
  delay: 0.20
  request_stmin: 0.0
  fc_wait_timeout: 3.0
  fc_bs: 0x00
  fc_stmin: 0x00
  drain_before_request: 0.0

default_target: ecu1

targets:
  ecu1:
    txid: 0x681
    rxid: 0x601
    session_flow: [0x03]
